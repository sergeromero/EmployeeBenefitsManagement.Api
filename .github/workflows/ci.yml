name: HealthBenefitsPortal CI

on:
    push:
        branches:
            - main
            
    pull_request:
        branches:
            - main
            
jobs:
    backend:
        runs-on: ubuntu-latest
        
        defaults:
            run:
                working-directory: src/backend
                        
        steps:
            - name: Checkout source
              uses: actions/checkout@v4
              
            - name: Set up .Net
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '10.0.x'
                
            - name: Restore dependencies
              run: dotnet restore
              
            - name: Build
              run: dotnet build --no-restore
              
            - name: Run unit tests
              run: dotnet test --no-build
              
    frontend:
        runs-on: ubuntu-latest
        
        defaults:
            run:
                working-directory: src/frontend/health-benefits-portal-ui
                
        steps:
          - name: Checkout source code
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: '24.18.0'
              cache: 'npm'
              cache-dependency-path: src/frontend/health-benefits-portal-ui/package-lock.json
            
          - name: Install dependencies
            run: npm ci
            
          - name: Build frontend
            run: npm run build
            
          - name: Run frontend tests
            run: npm test -- --watch=false
 